---
- name: Créer le dossier temporaire
  ansible.windows.win_file:
    path: C:\Temp
    state: directory

- name: Télécharger Windows Exporter
  ansible.windows.win_get_url:
    url: >-
      https://github.com/prometheus-community/windows_exporter/releases/download/v{{ windows_exporter_version }}/windows_exporter-{{ windows_exporter_version }}-amd64.msi
    dest: C:\Temp\windows_exporter.msi

- name: Installer Windows Exporter
  ansible.windows.win_package:
    path: C:\Temp\windows_exporter.msi
    state: present
    arguments: >-
      LISTEN_PORT={{ windows_exporter_port }}
      ADDLOCAL=FirewallException

- name: Déployer la configuration de Windows Exporter
  ansible.windows.win_template:
    src: config.yaml.j2
    dest: C:\Program Files\windows_exporter\config.yaml

- name: Démarrer Windows Exporter au démarrage
  ansible.windows.win_service:
    name: windows_exporter
    start_mode: auto
    state: started

- name: Vérifier le port de Windows Exporter
  ansible.windows.win_wait_for:
    port: "{{ windows_exporter_port }}"
    state: started
    timeout: 30
