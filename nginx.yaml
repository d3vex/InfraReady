---
- name: Déployer le site InfraReady sur LINUX01
  hosts: linux
  become: "{{ ansible_become }}"

  vars_files:
    - vars/linux.yaml
    - vars/nginx.yaml

  tasks:
    - name: Installer Nginx
      ansible.builtin.package:
        name: "{{ web_package }}"
        state: present

    - name: Démarrer Nginx et activer son démarrage automatique
      ansible.builtin.service:
        name: "{{ web_package }}"
        state: started
        enabled: true

    - name: Déployer la page HTML
      ansible.builtin.template:
        src: templates/index.html.j2
        dest: /usr/share/nginx/html/index2.html
        owner: root
        group: root
        mode: "0644"

